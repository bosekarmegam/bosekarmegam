<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" viewBox="0 0 460 340" role="img" aria-label="About Suneel Bose K">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"><animate attributeName="stop-color" values="#7dd3fc;#a78bfa;#34d399;#f472b6;#7dd3fc" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#34d399"><animate attributeName="stop-color" values="#34d399;#f472b6;#7dd3fc;#a78bfa;#34d399" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="py" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <linearGradient id="ts" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="js" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <clipPath id="clip"><rect x="2" y="2" width="456" height="336" rx="18"/></clipPath>
  </defs>

  <!-- card with animated gradient border -->
  <rect x="2" y="2" width="456" height="336" rx="18" fill="url(#card)" stroke="url(#border)" stroke-width="2.5"/>

  <!-- subtle scanning highlight -->
  <g clip-path="url(#clip)">
    <rect x="-200" y="0" width="140" height="340" fill="#ffffff" fill-opacity="0.04" transform="skewX(-20)">
      <animate attributeName="x" from="-200" to="620" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
    <text x="28" y="40" font-size="13" font-weight="700" fill="#64748b" letter-spacing="3">PROFILE</text>
    <circle cx="420" cy="35" r="5" fill="#34d399">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="408" y="40" font-size="12" fill="#34d399" text-anchor="end">open to collaborate</text>

    <!-- info rows (each slides in) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="0.6s" begin="0.2s" fill="freeze"/>
      <rect x="28" y="60" width="34" height="34" rx="9" fill="#7dd3fc" fill-opacity="0.15"/>
      <path d="M45,68 a6,6 0 1,0 0.1,0 Z M35,88 c0,-7 20,-7 20,0" fill="#7dd3fc"/>
      <text x="74" y="73" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1.5">ROLE</text>
      <text x="74" y="90" font-size="15" fill="#e2e8f0" font-weight="600">Geospatial Engineer &amp; Full-Stack Dev</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="0.6s" begin="0.5s" fill="freeze"/>
      <rect x="28" y="106" width="34" height="34" rx="9" fill="#a78bfa" fill-opacity="0.15"/>
      <path d="M37,133 v-14 h8 v-6 h8 v20 Z M40,122 h2 M40,127 h2 M48,117 h2 M48,122 h2 M48,127 h2" stroke="#a78bfa" stroke-width="1.8" fill="none"/>
      <text x="74" y="119" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1.5">COMPANY</text>
      <text x="74" y="136" font-size="15" fill="#e2e8f0" font-weight="600">ArcGX TechLabs Private Limited</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="0.6s" begin="0.8s" fill="freeze"/>
      <rect x="28" y="152" width="34" height="34" rx="9" fill="#f472b6" fill-opacity="0.15"/>
      <path d="M45,160 c-4.5,0 -8,3.5 -8,8 c0,6 8,13 8,13 c0,0 8,-7 8,-13 c0,-4.5 -3.5,-8 -8,-8 Z" fill="#f472b6"/>
      <circle cx="45" cy="168" r="3" fill="#0b1020"/>
      <text x="74" y="165" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1.5">LOCATION</text>
      <text x="74" y="182" font-size="15" fill="#e2e8f0" font-weight="600">Tamil Nadu, India</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="0.6s" begin="1.1s" fill="freeze"/>
      <rect x="28" y="198" width="34" height="34" rx="9" fill="#34d399" fill-opacity="0.15"/>
      <path d="M33,214 l12,-6 l12,6 l-12,6 Z M39,217 v6 c0,3 12,3 12,0 v-6" stroke="#34d399" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      <text x="74" y="211" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1.5">EDUCATION</text>
      <text x="74" y="228" font-size="15" fill="#e2e8f0" font-weight="600">B.Tech, Bharathidasan University</text>
    </g>

    <!-- language bars -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
      <text x="28" y="258" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1.5">LANGUAGES</text>

      <text x="28" y="282" font-size="12" fill="#cbd5e1">Python</text>
      <rect x="110" y="273" width="322" height="10" rx="5" fill="#1e293b"/>
      <rect x="110" y="273" width="0" height="10" rx="5" fill="url(#py)">
        <animate attributeName="width" from="0" to="290" dur="1.4s" begin="1.6s" fill="freeze"/>
      </rect>

      <text x="28" y="302" font-size="12" fill="#cbd5e1">TypeScript</text>
      <rect x="110" y="293" width="322" height="10" rx="5" fill="#1e293b"/>
      <rect x="110" y="293" width="0" height="10" rx="5" fill="url(#ts)">
        <animate attributeName="width" from="0" to="245" dur="1.4s" begin="1.8s" fill="freeze"/>
      </rect>

      <text x="28" y="322" font-size="12" fill="#cbd5e1">JavaScript</text>
      <rect x="110" y="313" width="322" height="10" rx="5" fill="#1e293b"/>
      <rect x="110" y="313" width="0" height="10" rx="5" fill="url(#js)">
        <animate attributeName="width" from="0" to="210" dur="1.4s" begin="2s" fill="freeze"/>
      </rect>
    </g>
  </g>
</svg>
