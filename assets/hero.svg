<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Suneel Bose K - Geospatial Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#101a3a"/>
      <stop offset="100%" stop-color="#061c2a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc">
        <animate attributeName="stop-color" values="#7dd3fc;#a78bfa;#34d399;#7dd3fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#7dd3fc;#f472b6;#34d399" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <polygon points="28,2 52,15 52,40 28,53 4,40 4,15" fill="none" stroke="#38bdf8" stroke-opacity="0.13" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- drifting hex grid -->
  <g>
    <rect x="-60" y="-60" width="1320" height="440" fill="url(#hex)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="56 48.5" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- moving glow blobs -->
  <g filter="url(#blur)">
    <circle cx="200" cy="80" r="120" fill="#38bdf8" fill-opacity="0.22">
      <animate attributeName="cx" values="200;420;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;220;80" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="240" r="140" fill="#a78bfa" fill-opacity="0.20">
      <animate attributeName="cx" values="1000;800;1000" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;90;240" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="300" r="110" fill="#34d399" fill-opacity="0.16">
      <animate attributeName="cx" values="620;700;540;620" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- pulsing H3-style hex cluster on the right -->
  <g transform="translate(1035,160) scale(0.82)" stroke="#7dd3fc" stroke-width="2" fill="#0ea5e9" fill-opacity="0.12">
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25">
      <animate attributeName="fill-opacity" values="0.1;0.45;0.1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="86,-100 129,-75 129,-25 86,0 43,-25 43,-75" transform="translate(0,0)">
      <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="86,0 129,25 129,75 86,100 43,75 43,25">
      <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="-86,-100 -43,-75 -43,-25 -86,0 -129,-25 -129,-75">
      <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="-86,0 -43,25 -43,75 -86,100 -129,75 -129,25">
      <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-150 43,-125 43,-75 0,-50 -43,-75 -43,-125">
      <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="3s" begin="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,50 43,75 43,125 0,150 -43,125 -43,75">
      <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="3s" begin="2.4s" repeatCount="indefinite"/>
    </polygon>
    <!-- orbiting satellite -->
    <circle r="6" fill="#f472b6" stroke="none">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0,-115 A115,115 0 1,1 -0.1,-115 Z"/>
    </circle>
    <circle r="115" fill="none" stroke="#f472b6" stroke-opacity="0.35" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <!-- radar sweep -->
    <path d="M0,0 L0,-115 A115,115 0 0,1 99.6,-57.5 Z" fill="url(#glow)" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- greeting -->
  <text x="72" y="110" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8" opacity="0">
    Hi there, I'm
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- name -->
  <text x="70" y="178" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#txt)" opacity="0">
    Suneel Bose K
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
    <animate attributeName="x" from="40" to="70" dur="1.2s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- animated underline -->
  <rect x="72" y="196" width="0" height="4" rx="2" fill="url(#txt)">
    <animate attributeName="width" from="0" to="470" dur="1.4s" begin="1.4s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <text x="72" y="244" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1" opacity="0">
    Geospatial Engineer  •  Python &amp; TypeScript Developer  •  Building AI-native GIS tools
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze"/>
  </text>

  <!-- location pin -->
  <g transform="translate(72,270)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.6s" fill="freeze"/>
    <path d="M8,0 C3.6,0 0,3.6 0,8 C0,14 8,22 8,22 C8,22 16,14 16,8 C16,3.6 12.4,0 8,0 Z" fill="#f472b6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="8" cy="8" r="3" fill="#0b1020">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Tamil Nadu, India  •  ArcGX TechLabs</text>
  </g>
</svg>
