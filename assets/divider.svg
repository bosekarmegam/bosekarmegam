<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="10" width="1200" height="3" rx="2" fill="url(#g)"/>
  <circle cx="0" cy="11.5" r="4" fill="#f472b6">
    <animate attributeName="cx" values="0;1200;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
